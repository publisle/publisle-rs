[package]
name = "publisle-pdf"
version = "0.3.0"
edition = "2024"
publish = false
license = "MIT"
description = "Publisle's bounded native document typesetter"

[dependencies]
flate2 = "1.1"
pdf-writer = "0.14"
rustybuzz = "0.20"
subsetter = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ttf-parser = "0.25"
unicode-bidi = "0.3"
unicode-linebreak = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
resvg = { version = "0.45", default-features = false, features = ["text"] }
svg2pdf = { version = "=0.13.0", default-features = false, features = ["text", "filters"] }
lopdf = { version = "0.38", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
