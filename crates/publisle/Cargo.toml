[package]
name = "publisle"
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
description = "Publisle typesetting and math facade"
documentation = "https://docs.rs/publisle"
keywords = ["pdf", "typesetting", "math", "publishing"]
categories = ["text-processing", "rendering"]

[features]
default = ["pdf"]
pdf = ["dep:publisle-pdf"]
math = ["dep:publisle-math"]

[dependencies]
publisle-pdf = { path = "../publisle-pdf", version = "0.5.1", optional = true }
publisle-math = { path = "../publisle-math", version = "0.2.0", optional = true }

[package.metadata.docs.rs]
all-features = true
