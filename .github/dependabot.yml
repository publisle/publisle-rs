version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    ignore:
      # svg2pdf 0.13.0 is built against usvg 0.45. resvg 0.46+ pulls usvg 0.49
      # and the two Tree types do not match (see issue #27). Patch updates of
      # the 0.45 line can still open.
      - dependency-name: resvg
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
