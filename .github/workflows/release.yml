name: Release Rust crates and native npm packages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-release
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  crates:
    needs: validate
    if: github.repository == 'publisle/publisle-rs' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup show active-toolchain
      - uses: release-plz/action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
  npm:
    needs: [validate, crates]
    if: github.repository == 'publisle/publisle-rs' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@12.2.0
      - uses: actions/download-artifact@v8
        with:
          pattern: native-pdf-*
          path: ${{ runner.temp }}/native-packages
          merge-multiple: true
      - name: Restore accepted uploads from an earlier attempt of this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREVIOUS=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate --slurp | jq -r '[.[].artifacts[] | select(.expired == false) | select(.name | startswith("native-publication-progress-"))] | sort_by(.id) | last | .name // empty')
          if [ -n "$PREVIOUS" ]; then
            gh run download "$GITHUB_RUN_ID" --name "$PREVIOUS" --dir "$RUNNER_TEMP/native-packages"
          fi
      - name: Publish the exact five validated tarballs, then retain release evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags origin
          node tools/publish-npm.mjs "$RUNNER_TEMP/native-packages"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-publication-progress-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-packages/accepted-uploads.json
            ${{ runner.temp }}/native-packages/native-release.json
          if-no-files-found: ignore
          retention-days: 90
  release-pr:
    # cargo-semver-checks 0.51 requires rustdoc >= 1.93. Engine CI and
    # publication still use the repository's pinned 1.90 toolchain.
    env:
      RUSTUP_TOOLCHAIN: 1.93.0
    needs: validate
    if: github.repository == 'publisle/publisle-rs' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install 1.93.0 --profile minimal
      - run: rustup show active-toolchain
      - uses: release-plz/action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5
        id: release-pr
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Validate the release PR created with GITHUB_TOKEN
        if: steps.release-pr.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_JSON: ${{ steps.release-pr.outputs.pr }}
        run: |
          NUMBER=$(node -e 'console.log(JSON.parse(process.env.PR_JSON).number)')
          BRANCH=$(gh pr view "$NUMBER" --json headRefName --jq .headRefName)
          gh workflow run ci.yml --ref "$BRANCH"
