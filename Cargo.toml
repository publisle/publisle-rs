[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
license = "MIT"
edition = "2024"
rust-version = "1.90"
repository = "https://github.com/publisle/publisle-rs"

homepage = "https://publisle.xyz"
authors = ["Publisle contributors"]
readme = "README.md"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
